name: Unit Tests (Ubuntu 24.04)

# Run the unit tests after the Ubuntu build has completed successfully.
on:
  workflow_run:
    workflows: [ "Build (Ubuntu 24.04)" ]
    types: [ completed ]
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggers

env:
  MLE_ROOT: ${{ github.workspace }}/MagicLantern

jobs:
  unit-tests:
    name: Ubuntu 24.04 Unit Tests
    runs-on: ubuntu-24.04
    # Skip the tests if the build failed or was cancelled.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      # Test the same commit that was built.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # libgtest-dev provides Google Test.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgtest-dev

      # Download the Debug libmlutil built by the Ubuntu build into $MLE_ROOT.
      # When started manually, the latest successful build is used.
      - name: Download mle-core-util artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh run download $RUN_ID \
            --repo ${{ github.repository }} \
            --name mle-core-util-ubuntu-24.04-Debug \
            --dir "$MLE_ROOT"
          ls -R "$MLE_ROOT"

      - name: Build unit tests
        run: |
          cmake -S util/linux/test -B build/libmlutil-test -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$MLE_ROOT"
          cmake --build build/libmlutil-test --parallel 4

      - name: Run unit tests
        run: ctest --test-dir build/libmlutil-test --output-on-failure --verbose
